<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing Lab – NSE equity dashboard</title>
<style>
:root{--bg:#eef1f4;--sf:#fcfcfb;--ink:#16202e;--mut:#5d6b7c;--ln:#d5dbe2;--up:#0b7a62;--dn:#b8421a;--ac:#27408b;--wn:#8a6100;--s1:#2a78d6;--info:#e4ebf8;--infot:#1f3568;--bad:#fbe3dc;--badt:#7a2410;--warn:#fff1c9;--warnt:#6b4a00}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1620;--sf:#1a1a19;--ink:#e6ebf1;--mut:#a9b3c0;--ln:#2e3744;--up:#3cc6a3;--dn:#f08a62;--ac:#8fa8ee;--wn:#e3b341;--s1:#3987e5;--info:#1c2a47;--infot:#b9c8f2;--bad:#4a2118;--badt:#f6b8a5;--warn:#3a2f10;--warnt:#f3d47a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1150px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1{font-size:22px;margin:0 0 2px;font-weight:600}h2{font-size:16px;margin:0 0 10px;font-weight:600}header p{margin:0;color:var(--mut)}
.note{padding:10px 14px;border-radius:6px;margin:12px 0;font-size:13px;background:var(--info);color:var(--infot)}
.note.bad{background:var(--bad);color:var(--badt)}.note.warn{background:var(--warn);color:var(--warnt)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:600}
button:focus-visible,select:focus-visible,tr.row:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.chip small{display:block;color:var(--mut)}
.chip.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}.chip:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select{font:inherit;padding:7px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);max-width:100%}
.btn{font:inherit;padding:5px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);cursor:pointer}
.cfg{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{border-left:3px solid var(--ln);padding:2px 10px}.kpi b{display:block;font-size:20px;font-weight:600}.kpi span{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
td.l,th.l{text-align:left;white-space:normal}tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--wn)}.mu{color:var(--mut)}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:4px;padding:1px 6px;color:var(--mut)}.tag.low{border-color:var(--dn);color:var(--dn)}
p.s{color:var(--mut);margin:0 0 8px}ul{margin:6px 0 0;padding-left:20px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-bottom:6px}.leg i{display:inline-block;width:18px;height:0;border-top:2px solid var(--s1);vertical-align:middle;margin-right:6px}.leg i.b{border-top:2px dashed var(--mut)}
.chart{position:relative}svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 9px;font-size:12px;display:none;white-space:nowrap;z-index:2}
.rules dt{font-weight:600;margin-top:8px}.rules dd{margin:2px 0 0;color:var(--mut)}
footer{color:var(--mut);font-size:12px;padding:8px 0 24px}
</style></head><body><div class="wrap">
<header><h1>Swing Lab</h1><p>Weekly and monthly technique tester for NSE equity (EQ series) stocks</p></header>
<div id="status"></div>
<nav id="nav"></nav><main id="main"><div class="box">Loading data…</div></main>
<footer>Research output, not investment advice. Figures come from NSE end-of-day files. Backtests show how a rule behaved in the past and do not guarantee future results.</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(n,d=1)=>Number(n).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const N=(v,d=1,suf="")=>v==null?"n/a":num(v,d)+suf;
const pct=n=>(n>=0?"+":"")+num(n,2)+"%";
const cls=n=>n==null?"":n>=0?"up":"dn";
const inr=n=>(n<0?"-":"")+"₹"+Math.round(Math.abs(n)).toLocaleString("en-IN");
const dt=s=>{const d=new Date(s+"T00:00:00");return isNaN(d)?esc(s):d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})};
const PL={"1D":"Latest session","1W":"1 week","1M":"1 month","3M":"3 months","1Y":"1 year"};
const WL={"all":"Full history","3Y":"3 years","1Y":"1 year","3M":"3 months","1M":"1 month"};
let M=null,H=null,T=null,problems=[],tab="mkt",per="1D",win="all",sel=null,closedF="all",asTable=false,CH=null;

async function getJSON(p){const r=await fetch(p+"?t="+Date.now());if(!r.ok)throw new Error(p+" returned HTTP "+r.status);return r.json()}
async function load(){
  const [m,h,t]=await Promise.allSettled([getJSON("data/market.json"),getJSON("data/health.json"),getJSON("data/techniques.json")]);
  if(m.status=="fulfilled")M=m.value;else problems.push("Market data not found. Run the Daily update in GitHub Actions, then reload. ("+m.reason.message+")");
  if(h.status=="fulfilled")H=h.value;else problems.push("Health report not found. ("+h.reason.message+")");
  if(t.status=="fulfilled"){T=t.value;sel=T.techniques.length?T.techniques[0].id:null}
  if(M&&!(M.periods&&M.periods[per])){const k=Object.keys(PL).find(x=>M.periods&&M.periods[x]);if(k)per=k}
  render();
}
function status(){
  let h="";
  problems.forEach(p=>h+=`<div class="note bad">${esc(p)}</div>`);
  if(H&&H.overall=="FAIL")h+=`<div class="note bad"><b>Data checks failed.</b> New numbers were not published. What you see is from the last good update (${dt(M?M.as_of:H.as_of)}). Open the Data health tab for details.</div>`;
  if(M){const age=Math.floor((Date.now()-new Date(M.as_of+"T00:00:00"))/864e5);
    if(age>4)h+=`<div class="note warn"><b>Data is ${age} days old.</b> The daily update may have failed. Check the Actions tab in GitHub.</div>`}
  $("status").innerHTML=h;
}
const TABS=[["mkt","Market overview"],["board","Leaderboard"],["sig","Today’s signals"],["open","Open paper trades"],["closed","Closed trades"],["health","Data health"]];
function nav(){$("nav").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${k==tab?"on":""}">${l}</button>`).join("")}
function kpi(v,l,c=""){return `<div class="kpi"><b class="${c}">${v}</b><span>${l}</span></div>`}
const noT=()=>`<div class="box"><h2>No technique results yet</h2><p class="s">The page needs docs/data/techniques.json. It is created by the Daily update once engine.py and the three tech_ files are in the repository. Run the Daily update, wait for a green tick, then reload.</p></div>`;

/* ---------- market overview ---------- */
function tbl(rows){
  if(!rows||!rows.length)return `<p class="mu">No stocks to show.</p>`;
  return `<div class="sc"><table><thead><tr><th>Stock</th><th>Close (₹)</th><th>Change</th><th>Traded (₹ cr)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.symbol)}</td><td>${num(r.close,2)}</td><td class="${cls(r.change_pct)}">${pct(r.change_pct)}</td><td>${num(r.traded_cr,1)}</td></tr>`).join("")}</tbody></table></div>`;
}
function mkt(){
  if(!M)return `<div class="box"><h2>No market data yet</h2><p class="s">The page needs docs/data/market.json. Run the Daily update in GitHub Actions and wait for a green tick, then reload.</p></div>`;
  const P=M.periods[per];
  const chips=Object.keys(PL).map(k=>{const ok=!!M.periods[k];return `<button class="chip ${k==per?"on":""}" data-p="${k}" ${ok?"":'disabled title="Needs more stored history"'}>${PL[k]}</button>`}).join("");
  const missing=Object.keys(PL).filter(k=>!M.periods[k]);
  return `<div class="box"><div class="chips">${chips}</div>
   <div class="cfg"><span>Data as of: <b>${dt(M.as_of)}</b></span><span>Source: ${esc(M.source)}</span><span>Universe: EQ series, average daily value above ₹${num(M.min_daily_value_cr,0)} cr</span><span>Updated: ${esc(M.generated_at.replace("T"," "))} IST</span></div>
   ${missing.length?`<p class="s" style="margin:8px 0 0">Greyed-out periods need more stored history. They appear as the history grows.</p>`:""}</div>
  <div class="box"><h2>Market snapshot</h2><div class="kpis">
   ${kpi(num(P.advances,0)+" up / "+num(P.declines,0)+" down","Stocks, compared with "+dt(P.from))}
   ${kpi(num(M.liquid_universe,0),"Stocks passing the liquidity filter")}
   ${kpi(num(M.closing_52w_highs,0),"At a 52-week closing high")}
   ${kpi(num(M.closing_52w_lows,0),"At a 52-week closing low")}
   ${kpi("₹"+num(M.total_traded_value_cr,0)+" cr","Total traded value, latest session")}
  </div></div>
  <div class="two"><div class="box"><h2>Top 10 gainers</h2>${tbl(P.gainers)}</div><div class="box"><h2>Top 10 losers</h2>${tbl(P.losers)}</div></div>
  <div class="box"><p class="s" style="margin:0"><b>Not available yet:</b> Nifty 50, Sensex and Nifty 500 index levels, India VIX, FII and DII flows, sector performance and custom date ranges. These need extra data sources or longer history. Nothing is estimated in their place.</p></div>`;
}

/* ---------- leaderboard ---------- */
function ranked(){
  const L=T.techniques.map(t=>({t,m:t.windows[win]||{}}));
  L.sort((a,b)=>(!!a.m.low_sample-!!b.m.low_sample)||((b.m.sharpe??-99)-(a.m.sharpe??-99)));
  L.forEach((x,i)=>x.rank=i+1);return L;
}
function eqChart(t,m){
  let pts=t.equity;
  if(win!="all"&&m.from)pts=pts.filter(p=>p[0]>=m.from);
  if(pts.length<2)return {html:`<p class="mu">Not enough history for a curve in this period.</p>`,pts:[]};
  const cap=T.config.capital,e0=pts[0][1],b0=pts[0][2];
  const D=pts.map(p=>[p[0],p[1]/e0*cap,p[2]/b0*cap]);
  const W=700,Hh=260,L=46,R=84,Tp=12,B=26,all=D.flatMap(p=>[p[1],p[2]]),mn=Math.min(...all),mx=Math.max(...all);
  const x=i=>L+i*(W-L-R)/(D.length-1),y=v=>Tp+(1-(v-mn)/((mx-mn)||1))*(Hh-Tp-B);
  const path=k=>D.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1)).join("");
  let g="";for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mut)">${num(v/1e5,1)}L</text>`}
  const ye=y(D[D.length-1][1]),yb=y(D[D.length-1][2]);let yb2=yb;if(Math.abs(ye-yb)<14)yb2=ye<yb?ye+14:ye-14;
  const mid=D[Math.floor(D.length/2)][0];
  const html=`<div class="leg"><span><i></i>${esc(t.name)}</span><span><i class="b"></i>${esc(T.benchmark_label)}</span></div>
   <div class="chart" id="chart"><svg id="svg" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Value of ₹${num(cap/1e5,1)} lakh over time for ${esc(t.name)} compared with the average liquid stock">
   ${g}<path d="${path(2)}" fill="none" stroke="var(--mut)" stroke-width="1.5" stroke-dasharray="5 4"/><path d="${path(1)}" fill="none" stroke="var(--s1)" stroke-width="2"/>
   <text x="${W-R+6}" y="${ye+4}" font-size="11" fill="var(--ink)">Technique</text><text x="${W-R+6}" y="${yb2+4}" font-size="11" fill="var(--mut)">Avg stock</text>
   <text x="${L}" y="${Hh-6}" font-size="11" fill="var(--mut)">${dt(D[0][0])}</text><text x="${(L+W-R)/2}" y="${Hh-6}" font-size="11" text-anchor="middle" fill="var(--mut)">${dt(mid)}</text><text x="${W-R}" y="${Hh-6}" font-size="11" text-anchor="end" fill="var(--mut)">${dt(D[D.length-1][0])}</text>
   <line id="cx" y1="${Tp}" y2="${Hh-B}" stroke="var(--mut)" style="display:none"/><circle id="d1" r="4" fill="var(--s1)" stroke="var(--sf)" stroke-width="2" style="display:none"/><circle id="d2" r="4" fill="var(--mut)" stroke="var(--sf)" stroke-width="2" style="display:none"/>
   <rect id="hit" x="${L}" y="${Tp}" width="${W-L-R}" height="${Hh-Tp-B}" fill="transparent"/></svg><div class="tip" id="tip"></div></div>`;
  return {html,pts:D,geom:{W,Hh,L,R,x,y}};
}
function tableView(D){
  const rows=D.slice(-52).reverse();
  return `<div class="sc"><table><thead><tr><th>Date</th><th>Technique (₹)</th><th>Average stock (₹)</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${dt(p[0])}</td><td>${num(p[1],0)}</td><td>${num(p[2],0)}</td></tr>`).join("")}</tbody></table></div><p class="s">Latest 52 weekly points.</p>`;
}
function detail(t,m){
  if(!m||m.trades==null)return `<div class="box"><h2>${esc(t.name)}</h2><p class="s">No results for this period.</p></div>`;
  const ch=eqChart(t,m);CH=ch;
  const rules=`<dl class="rules"><dt>Entry</dt><dd>${esc(t.rules.entry)}</dd><dt>Exit</dt><dd>${esc(t.rules.exit)}</dd><dt>Stop-loss</dt><dd>${esc(t.rules.stop)}</dd></dl>`;
  return `<div class="box"><h2>${esc(t.name)} <span class="tag">${t.hold=="W"?"weekly hold":"monthly hold"}</span> ${m.low_sample?'<span class="tag low">low sample: too few trades</span>':""}</h2>
  <div class="kpis">
   ${kpi(m.cagr_pct!=null?N(m.cagr_pct,1,"%"):N(m.return_pct,1,"%"),m.cagr_pct!=null?"CAGR":"Return for period",cls(m.cagr_pct!=null?m.cagr_pct:m.return_pct))}
   ${kpi(N(m.win_rate_pct,1,"%"),"Win rate")}${kpi(N(m.profit_factor,2),"Profit factor")}${kpi(N(m.max_drawdown_pct,1,"%"),"Max drawdown",m.max_drawdown_pct!=null?"dn":"")}
   ${kpi(N(m.sharpe,2),"Sharpe ratio")}${kpi(m.trades,"Closed trades")}${kpi(N(m.expectancy_pct,2,"%"),"Average return per trade",cls(m.expectancy_pct))}${kpi(N(m.avg_days,0)+" days","Average holding time")}
  </div>
  <div class="bar"><b>Value of ₹${num(T.config.capital/1e5,1)} lakh over time</b><button class="btn" data-tbl="1">${asTable?"Show chart":"Show as table"}</button></div>
  ${asTable?tableView(ch.pts):ch.html}
  <h2 style="margin-top:14px">How it works</h2>${rules}
  <p class="s" style="margin-top:10px">Not available yet: performance by market regime. It needs macro data (VIX, rates, inflation) that the free daily file does not contain.</p></div>`;
}
function board(){
  if(!T)return noT();
  if(!T.techniques.length)return noT();
  const R=ranked(),cur=R.find(x=>x.t.id==sel)||R[0],c=T.config;
  const chips=R.map(x=>`<button class="chip ${x.t.id==cur.t.id?"on":""}" data-t="${x.t.id}">#${x.rank} ${esc(x.t.name)}<small>${x.m.cagr_pct!=null?N(x.m.cagr_pct,1,"% CAGR"):N(x.m.return_pct,1,"% return")} · ${N(x.m.win_rate_pct,0,"% wins")}</small></button>`).join("");
  const rows=R.map(x=>{const m=x.m;return `<tr class="row" tabindex="0" data-t="${x.t.id}"><td>${x.rank}. ${esc(x.t.name)}</td><td>${x.t.hold=="W"?"Weekly":"Monthly"}</td><td class="${cls(m.cagr_pct!=null?m.cagr_pct:m.return_pct)}">${m.cagr_pct!=null?N(m.cagr_pct,1,"%"):N(m.return_pct,1,"%")}</td><td>${N(m.win_rate_pct,1,"%")}</td><td>${N(m.profit_factor,2)}</td><td class="dn">${N(m.max_drawdown_pct,1,"%")}</td><td>${N(m.sharpe,2)}</td><td>${m.trades??0}${m.low_sample?' <span class="tag low">low</span>':""}</td></tr>`}).join("");
  return `<div class="note warn"><b>Simulated results.</b> These are paper trades replayed from stored NSE prices, not real money. Real trading would differ: fills can be worse than the open, some stocks hit circuit limits or trading halts, and splits are recognised from price patterns so a few may be missed. ETFs trading in the EQ series are not yet excluded. Treat the results as research, not a promise.</div>
  <div class="box"><div class="cfg"><span>Virtual capital per technique: <b>₹${num(c.capital,0)}</b></span><span>Risk per trade: <b>${c.risk_pct}%</b></span><span>Max open positions: <b>${c.max_positions}</b></span><span>Costs: <b>${c.cost_per_side_pct}%</b> and slippage <b>${c.slippage_per_side_pct}%</b> per side</span><span>History: <b>${dt(T.history_start)}</b> to <b>${dt(T.as_of)}</b> (${num(T.sessions,0)} sessions)</span><span>Ranked by Sharpe ratio; low-sample techniques rank last</span></div></div>
  <div class="bar"><label for="win">Period</label><select id="win">${Object.keys(WL).map(k=>`<option value="${k}" ${k==win?"selected":""}>${WL[k]}</option>`).join("")}</select><span class="mu">Shorter periods have fewer trades, so rankings are noisier.</span></div>
  <h2>Techniques</h2><div class="chips">${chips}</div>
  ${detail(cur.t,cur.m)}
  <div class="box"><h2>All techniques</h2><p class="s">Click a row to open it above.</p><div class="sc"><table><thead><tr><th>Technique (rank)</th><th>Hold</th><th>CAGR / return</th><th>Win rate</th><th>Profit factor</th><th>Max drawdown</th><th>Sharpe</th><th>Trades</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- signals and trades ---------- */
function sigs(){
  if(!T)return noT();
  const rows=T.techniques.flatMap(t=>t.signals.map(s=>({t:t.name,...s})));
  return `<div class="box"><h2>Today’s signals</h2><p class="s">Signals for the close of <b>${dt(T.as_of)}</b>. The paper trade enters at the next day’s open. Stop and quantity here are estimates from the close; the real ones use the actual open. Quantity is sized so a stop-loss costs about ${T.config.risk_pct}% of capital.</p>
  ${rows.length?`<div class="sc"><table><thead><tr><th>Technique</th><th>Stock</th><th>Close (₹)</th><th>Stop-loss (₹)</th><th>Quantity</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.t)}</td><td>${esc(s.symbol)}</td><td>${num(s.ref_close,2)}</td><td class="dn">${num(s.stop,2)}</td><td>${num(s.qty,0)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="mu">No technique produced a signal at this close. That is normal on many days.</p>`}</div>`+screens();
}
function screens(){
  return T.techniques.filter(t=>t.screen).map(t=>`<div class="box"><h2>Near the floor of their range: ${esc(t.name)}</h2>
   <p class="s">A watchlist, not a buy list. These liquid stocks are in a sideways range and sit in its lowest quarter at the close of ${dt(T.as_of)}. "Waiting" means no bounce yet, so the technique would not buy.</p>
   ${t.screen.length?`<div class="sc"><table><thead><tr><th>Stock</th><th>Close (₹)</th><th>Range low (₹)</th><th>Range high (₹)</th><th>Position in range</th><th>Buy signal</th></tr></thead><tbody>${t.screen.map(r=>`<tr><td>${esc(r.symbol)}</td><td>${num(r.close,2)}</td><td>${num(r.range_low,2)}</td><td>${num(r.range_high,2)}</td><td>${num(r.pos_pct,0)}%</td><td class="${r.buy_signal?"up":"mu"}">${r.buy_signal?"Yes":"Waiting"}</td></tr>`).join("")}</tbody></table></div><p class="s" style="margin-top:8px">Position in range: 0% is the lowest low of the last 40 trading days, 100% is the highest high.</p>`:`<p class="mu">No stocks are near the floor of a range today.</p>`}</div>`).join("");
}
function opens(){
  if(!T)return noT();
  const rows=T.techniques.flatMap(t=>t.open.map(o=>({t:t.name,...o})));
  return `<div class="box"><h2>Open paper trades</h2>${rows.length?`<div class="sc"><table><thead><tr><th>Technique</th><th>Stock</th><th>Entry date</th><th>Entry (₹)</th><th>Latest close (₹)</th><th>Return</th><th>Stop-loss (₹)</th><th>Quantity</th><th class="l">Note</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.t)}</td><td>${esc(o.symbol)}</td><td>${dt(o.entry_date)}</td><td>${num(o.entry_px,2)}</td><td>${num(o.last,2)}</td><td class="${cls(o.ret_pct)}">${pct(o.ret_pct)}</td><td class="dn">${num(o.stop,2)}</td><td>${num(o.qty,0)}</td><td class="l">${o.exit_planned?"Exit planned at next open":""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="mu">No open paper trades right now.</p>`}</div>`;
}
function closeds(){
  if(!T)return noT();
  const opts=`<option value="all">All techniques</option>`+T.techniques.map(t=>`<option value="${t.id}" ${t.id==closedF?"selected":""}>${esc(t.name)}</option>`).join("");
  const rows=T.techniques.filter(t=>closedF=="all"||t.id==closedF).flatMap(t=>t.closed.map(o=>({t:t.name,...o}))).sort((a,b)=>a.exit_date<b.exit_date?1:-1).slice(0,200);
  return `<div class="box"><h2>Closed trades</h2><div class="bar"><label for="cf">Show</label><select id="cf">${opts}</select><span class="mu">Latest 200 shown. Profit or loss is after costs and slippage.</span></div>
  ${rows.length?`<div class="sc"><table><thead><tr><th>Technique</th><th>Stock</th><th>Entry</th><th>Exit</th><th>Days</th><th>Return</th><th>Profit or loss</th><th class="l">Exit reason</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.t)}</td><td>${esc(o.symbol)}</td><td>${dt(o.entry_date)}</td><td>${dt(o.exit_date)}</td><td>${o.days}</td><td class="${cls(o.ret_pct)}">${pct(o.ret_pct)}</td><td class="${cls(o.pnl)}">${inr(o.pnl)}</td><td class="l">${esc(o.reason)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="mu">No closed trades yet.</p>`}</div>`;
}

/* ---------- data health ---------- */
function health(){
  if(!H)return `<div class="box"><h2>No health report yet</h2><p class="s">The page needs docs/data/health.json, which the Daily update creates.</p></div>`;
  const c=s=>s=="Pass"?"up":s=="Fail"?"dn":s=="Warn"?"wn":"mu";
  return `<div class="box"><h2>Data health: <span class="${H.overall=="PASS"?"up":"dn"}">${esc(H.overall)}</span></h2>
   <p class="s">Data as of <b>${dt(H.as_of)}</b>. Checked ${esc(H.generated_at.replace("T"," "))} IST. If a critical check fails, new numbers are not published that day.</p>
   <div class="sc"><table><thead><tr><th>Check</th><th>Status</th><th class="l">Detail</th></tr></thead><tbody>${H.checks.map(r=>`<tr><td class="l">${esc(r.check)}</td><td class="${c(r.status)}">${esc(r.status)}</td><td class="l">${esc(r.detail)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ---------- chart hover ---------- */
function bindChart(){
  const m=$("main"),svg=m.querySelector&&m.querySelector("#svg");
  if(!svg||!CH||!CH.pts||!CH.pts.length)return;
  const hit=svg.querySelector("#hit"),cx=svg.querySelector("#cx"),d1=svg.querySelector("#d1"),d2=svg.querySelector("#d2"),tip=m.querySelector("#tip"),G=CH.geom,D=CH.pts;
  const move=e=>{
    const p=e.touches?e.touches[0]:e,r=svg.getBoundingClientRect(),sx=(p.clientX-r.left)*(G.W/r.width);
    let i=Math.round((sx-G.L)/((G.W-G.L-G.R)/(D.length-1)));i=Math.max(0,Math.min(D.length-1,i));
    const X=G.x(i);cx.setAttribute("x1",X);cx.setAttribute("x2",X);cx.style.display="";
    d1.setAttribute("cx",X);d1.setAttribute("cy",G.y(D[i][1]));d1.style.display="";d2.setAttribute("cx",X);d2.setAttribute("cy",G.y(D[i][2]));d2.style.display="";
    tip.innerHTML=`<b>${dt(D[i][0])}</b><br>Technique: ${inr(D[i][1])}<br>Average stock: ${inr(D[i][2])}`;tip.style.display="block";
    const left=X/G.W*r.width;tip.style.left=Math.min(left+12,r.width-170)+"px";tip.style.top="8px";
  };
  const out=()=>{cx.style.display=d1.style.display=d2.style.display=tip.style.display="none"};
  hit.addEventListener("mousemove",move);hit.addEventListener("touchmove",move,{passive:true});hit.addEventListener("mouseleave",out);hit.addEventListener("touchend",out);
}

function render(){
  status();nav();CH=null;
  $("main").innerHTML=({mkt,board,sig:sigs,open:opens,closed:closeds,health})[tab]();
  bindChart();
}
$("nav").onclick=e=>{const b=e.target.closest("[data-k]");if(b){tab=b.dataset.k;render()}};
$("main").onclick=e=>{
  let b=e.target.closest("[data-p]");if(b&&!b.disabled){per=b.dataset.p;render();return}
  b=e.target.closest("[data-t]");if(b){sel=b.dataset.t;render();return}
  b=e.target.closest("[data-tbl]");if(b){asTable=!asTable;render()}
};
$("main").onkeydown=e=>{if(e.key=="Enter"){const b=e.target.closest&&e.target.closest("tr[data-t]");if(b){sel=b.dataset.t;render()}}};
$("main").onchange=e=>{
  if(e.target.id=="win"){win=e.target.value;render()}
  if(e.target.id=="cf"){closedF=e.target.value;render()}
};
load();
</script></body></html>
